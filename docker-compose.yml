services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: k0bus-portfolio
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    labels:
      - "arcane.project=portfolio"
      - "arcane.description=Static Portfolio Vue 3 + Vite + Tailwind"
