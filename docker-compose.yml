services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: k0bus-portfolio
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.portfolio.rule=Host(`k0bus.${DOMAIN}`)"
      - "traefik.http.routers.portfolio.entrypoints=https"
      - "traefik.http.routers.portfolio.tls.certresolver=letsencrypt"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"
      - "folder.view3=03-Applications"
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/portfolio.png"
      - "net.unraid.docker.webui=https://k0bus.${DOMAIN}"
      - "arcane.project=portfolio"
      - "arcane.description=Static Portfolio Vue 3 + Vite + Tailwind"

networks:
  default:
    driver: bridge
  proxy:
    external: true
